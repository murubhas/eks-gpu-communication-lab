apiVersion: v1
kind: Service
metadata:
  name: p5-nccl-internode
  namespace: gpu-communication-lab
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: p5-nccl-internode
  ports:
    - name: rendezvous
      port: 29500
      targetPort: 29500
---
apiVersion: v1
kind: Pod
metadata:
  name: p5-nccl-internode-0
  namespace: gpu-communication-lab
  labels:
    app: p5-nccl-internode
spec:
  hostname: p5-nccl-internode-0
  subdomain: p5-nccl-internode
  restartPolicy: Never
  nodeSelector:
    workload: p5-efa-lab
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: p5-nccl-internode
          topologyKey: kubernetes.io/hostname
  tolerations:
    - key: workload
      operator: Equal
      value: p5-efa-lab
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: p5-nccl-internode
      image: public.ecr.aws/deep-learning-containers/pytorch-training:2.9.0-gpu-py312-cu130-ubuntu22.04-ec2@sha256:c5af70b4143d7b1878567cc198c5a7961aff15e8c59fec35c2fb3cbd097cddcd
      imagePullPolicy: IfNotPresent
      env:
        - name: FI_PROVIDER
          value: efa
        - name: FI_EFA_USE_DEVICE_RDMA
          value: "1"
        - name: NCCL_NET_PLUGIN
          value: ofi
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: NCCL_DEBUG
          value: INFO
        - name: NCCL_DEBUG_SUBSYS
          value: INIT,NET,GRAPH
      command:
        - bash
        - -lc
        - >-
          set -euo pipefail;
          /opt/amazon/efa/bin/fi_info -p efa -t FI_EP_RDM >/dev/null;
          echo FI_INFO_EFA_OK host=${HOSTNAME} efa_devices=$(ls -1 /dev/infiniband/uverbs* | wc -l);
          torchrun --nnodes=2 --nproc_per_node=8 --node_rank=0
          --master_addr=p5-nccl-internode-0.p5-nccl-internode.gpu-communication-lab.svc.cluster.local
          --master_port=29500 /opt/test/efa_nccl_preflight.py
      resources:
        requests:
          cpu: "16"
          memory: 32Gi
          nvidia.com/gpu: "8"
          vpc.amazonaws.com/efa: "32"
        limits:
          nvidia.com/gpu: "8"
          vpc.amazonaws.com/efa: "32"
      volumeMounts:
        - name: preflight
          mountPath: /opt/test
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: preflight
      configMap:
        name: p5-nccl-preflight
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
---
