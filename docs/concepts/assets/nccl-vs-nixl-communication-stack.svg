<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14213d" flood-opacity="0.12"/>
    </filter>
    <style>text { letter-spacing: 0; }</style>
  </defs>
  <rect width="1536" height="1024" fill="#fbfcfe"/>

  <text x="768" y="50" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="39" font-weight="800" fill="#14213d" opacity="1">NCCL and NIXL: different jobs, shared high-speed fabrics</text>
  <text x="768" y="84" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="650" fill="#506079" opacity="1">NCCL coordinates GPU groups; NIXL moves inference state between memory locations</text>

  <rect x="24" y="116" width="731" height="716" rx="16" fill="#f7f9fc" stroke="#149447" stroke-width="3" filter="url(#softShadow)"/>
  <rect x="781" y="116" width="731" height="716" rx="16" fill="#f7f9fc" stroke="#6748d6" stroke-width="3" filter="url(#softShadow)"/>

  <!-- NCCL column -->
  <text x="50" y="154" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="28" font-weight="800" fill="#14213d" opacity="1">A. NCCL: coordinated GPU communication</text>
  <text x="50" y="182" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="650" fill="#506079" opacity="1">Used when ranks must participate in one distributed operation</text>

  <rect x="51" y="210" width="202" height="58" rx="9" fill="#edf9f1" stroke="#149447" stroke-width="2"/><text x="152" y="235" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1">PyTorch DDP / FSDP</text><text x="152" y="256" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="11" font-weight="500" fill="#506079" opacity="1">gradients and parameters</text>
  <rect x="277" y="210" width="202" height="58" rx="9" fill="#edf9f1" stroke="#149447" stroke-width="2"/><text x="378" y="235" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1">vLLM tensor parallel</text><text x="378" y="256" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="11" font-weight="500" fill="#506079" opacity="1">tensor shards per layer</text>
  <rect x="503" y="210" width="202" height="58" rx="9" fill="#edf9f1" stroke="#149447" stroke-width="2"/><text x="604" y="235" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1">Pipeline parallel</text><text x="604" y="256" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="11" font-weight="500" fill="#506079" opacity="1">activations at stage seams</text>
  <line x1="378" y1="274" x2="378" y2="308" stroke="#149447" stroke-width="4"/><polygon points="378,308 372,297 384,297" fill="#149447"/>

  <rect x="93" y="315" width="574" height="90" rx="12" fill="#ffffff" stroke="#149447" stroke-width="2" filter="url(#softShadow)"/>
  <text x="380" y="346" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="24" font-weight="800" fill="#149447" opacity="1">NVIDIA NCCL</text>
  <text x="380" y="374" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#14213d" opacity="1">all-reduce | all-gather | reduce-scatter | send / recv</text>
  <text x="380" y="395" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="500" fill="#506079" opacity="1">group semantics: participating ranks coordinate</text>

  <line x1="380" y1="410" x2="380" y2="453" stroke="#149447" stroke-width="4"/><polygon points="380,453 374,442 386,442" fill="#149447"/>
  <rect x="93" y="460" width="574" height="76" rx="11" fill="#edf9f1" stroke="#149447" stroke-width="2"/>
  <text x="380" y="489" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="19" font-weight="800" fill="#14213d" opacity="1">Topology-aware transport choice</text>
  <text x="380" y="516" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="500" fill="#506079" opacity="1">peer access locally; network plugin remotely</text>

  <line x1="263" y1="541" x2="263" y2="580" stroke="#3767e8" stroke-width="3"/><polygon points="263,580 257,569 269,569" fill="#3767e8"/>
  <line x1="497" y1="541" x2="497" y2="580" stroke="#6748d6" stroke-width="3"/><polygon points="497,580 491,569 503,569" fill="#6748d6"/>
  <rect x="55" y="587" width="330" height="109" rx="11" fill="#edf2ff" stroke="#3767e8" stroke-width="2"/>
  <text x="220" y="615" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="18" font-weight="800" fill="#3767e8" opacity="1">Inside one node</text>
  <text x="220" y="645" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#14213d" opacity="1">NVLink / NVSwitch</text>
  <text x="220" y="674" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#506079" opacity="1">or PCIe peer-to-peer</text>

  <rect x="405" y="587" width="322" height="109" rx="11" fill="#f4f0ff" stroke="#6748d6" stroke-width="2"/>
  <text x="566" y="615" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="18" font-weight="800" fill="#6748d6" opacity="1">Across EFA-enabled nodes</text>
  <text x="566" y="645" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#14213d" opacity="1">aws-ofi-nccl -&gt; libfabric</text>
  <text x="566" y="674" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#506079" opacity="1">-&gt; EFA / GPUDirect RDMA</text>

  <rect x="55" y="718" width="672" height="87" rx="10" fill="#ffffff" stroke="#7a8baa" stroke-width="2"/>
  <text x="391" y="746" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d" opacity="1">Mental model</text>
  <text x="391" y="772" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#506079"><tspan x="391" dy="0">NCCL defines the coordinated operation.</tspan><tspan x="391" dy="22">The topology and plugins determine how its bytes travel.</tspan></text>

  <!-- NIXL column -->
  <text x="807" y="154" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="28" font-weight="800" fill="#14213d" opacity="1">B. NIXL: inference state transfer</text>
  <text x="807" y="182" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="650" fill="#506079" opacity="1">Used when a producer and consumer exchange registered memory</text>

  <rect x="811" y="210" width="208" height="58" rx="9" fill="#eafafd" stroke="#13a9c6" stroke-width="2"/><text x="915" y="235" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1">Prefill vLLM</text><text x="915" y="256" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="11" font-weight="500" fill="#506079" opacity="1">creates KV / model state</text>
  <rect x="1042" y="210" width="208" height="58" rx="9" fill="#fff8df" stroke="#f1a208" stroke-width="2"/><text x="1146" y="235" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1">Router / sidecar</text><text x="1146" y="256" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="11" font-weight="500" fill="#506079" opacity="1">endpoint + transfer metadata</text>
  <rect x="1273" y="210" width="208" height="58" rx="9" fill="#eafafd" stroke="#13a9c6" stroke-width="2"/><text x="1377" y="235" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#14213d" opacity="1">Decode vLLM</text><text x="1377" y="256" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="11" font-weight="500" fill="#506079" opacity="1">consumes transferred state</text>
  <line x1="1019" y1="239" x2="1036" y2="239" stroke="#f1a208" stroke-width="3" stroke-dasharray="6 5"/><polygon points="1019,239 1030,233 1030,245" fill="#f1a208"/><polygon points="1036,239 1025,245 1025,233" fill="#f1a208"/>
  <line x1="1250" y1="239" x2="1267" y2="239" stroke="#f1a208" stroke-width="3" stroke-dasharray="6 5"/><polygon points="1250,239 1261,233 1261,245" fill="#f1a208"/><polygon points="1267,239 1256,245 1256,233" fill="#f1a208"/>
  <text x="1146" y="295" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="800" fill="#f1a208" opacity="1">control metadata</text>

  <rect x="850" y="315" width="594" height="90" rx="12" fill="#ffffff" stroke="#6748d6" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1147" y="346" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="22" font-weight="800" fill="#6748d6" opacity="1">NVIDIA Inference Xfer Library (NIXL)</text>
  <text x="1147" y="374" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#14213d" opacity="1">register memory | exchange descriptors | initiate transfer</text>
  <text x="1147" y="395" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="500" fill="#506079" opacity="1">point-to-point data movement, not a collective</text>
  <line x1="912" y1="275" x2="912" y2="310" stroke="#6748d6" stroke-width="4"/><polygon points="912,310 906,299 918,299" fill="#6748d6"/>
  <line x1="1380" y1="275" x2="1380" y2="310" stroke="#6748d6" stroke-width="4"/><polygon points="1380,310 1374,299 1386,299" fill="#6748d6"/>
  <line x1="1380" y1="410" x2="1380" y2="445" stroke="#6748d6" stroke-width="4"/><polygon points="1380,445 1374,434 1386,434" fill="#6748d6"/>

  <rect x="850" y="452" width="594" height="76" rx="11" fill="#f4f0ff" stroke="#6748d6" stroke-width="2"/>
  <text x="1147" y="481" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="19" font-weight="800" fill="#14213d" opacity="1">Backend selection follows memory location and fabric</text>
  <text x="1147" y="508" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="500" fill="#506079" opacity="1">local GPU memory, remote GPU memory, host memory, or storage</text>

  <line x1="1024" y1="533" x2="1024" y2="574" stroke="#3767e8" stroke-width="3"/><polygon points="1024,574 1018,563 1030,563" fill="#3767e8"/>
  <line x1="1268" y1="533" x2="1268" y2="574" stroke="#6748d6" stroke-width="3"/><polygon points="1268,574 1262,563 1274,563" fill="#6748d6"/>
  <rect x="811" y="581" width="340" height="115" rx="11" fill="#edf2ff" stroke="#3767e8" stroke-width="2"/>
  <text x="981" y="610" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="18" font-weight="800" fill="#3767e8" opacity="1">Local or same-system path</text>
  <text x="981" y="641" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#14213d" opacity="1">CUDA IPC / NVLink / PCIe</text>
  <text x="981" y="672" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#506079" opacity="1">backend depends on deployment</text>

  <rect x="1171" y="581" width="310" height="115" rx="11" fill="#f4f0ff" stroke="#6748d6" stroke-width="2"/>
  <text x="1326" y="610" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="18" font-weight="800" fill="#6748d6" opacity="1">AWS inter-node path</text>
  <text x="1326" y="641" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#14213d" opacity="1">LIBFABRIC -&gt; EFA</text>
  <text x="1326" y="672" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#506079" opacity="1">GPU VRAM with GPUDirect</text>

  <line x1="912" y1="701" x2="912" y2="724" stroke="#13a9c6" stroke-width="4"/><polygon points="912,724 906,713 918,713" fill="#13a9c6"/>
  <line x1="1380" y1="701" x2="1380" y2="724" stroke="#13a9c6" stroke-width="4"/><polygon points="1380,724 1374,713 1386,713" fill="#13a9c6"/>
  <rect x="850" y="731" width="594" height="74" rx="10" fill="#eafafd" stroke="#13a9c6" stroke-width="2"/>
  <text x="1147" y="759" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#13a9c6" opacity="1">Bulk payload</text>
  <text x="1147" y="786" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="700" fill="#14213d" opacity="1">prefill GPU state -&gt; decode GPU's preallocated blocks</text>

  <!-- Shared comparison -->
  <text x="35" y="870" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="23" font-weight="800" fill="#14213d" opacity="1">Keep the layers separate</text>
  <rect x="29" y="886" width="1478" height="92" rx="12" fill="#ffffff" stroke="#7a8baa" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="49" y="902" width="430" height="59" rx="9" fill="#edf9f1" stroke="#149447" stroke-width="2"/>
  <text x="264" y="926" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d" opacity="1">NCCL = communication semantics</text>
  <text x="264" y="949" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="500" fill="#506079" opacity="1">collectives and rank-to-rank operations</text>
  <rect x="503" y="902" width="430" height="59" rx="9" fill="#f4f0ff" stroke="#6748d6" stroke-width="2"/>
  <text x="718" y="926" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d" opacity="1">NIXL = inference data movement</text>
  <text x="718" y="949" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="500" fill="#506079" opacity="1">registered memory and storage locations</text>
  <rect x="957" y="902" width="530" height="59" rx="9" fill="#fff8df" stroke="#f1a208" stroke-width="2"/>
  <text x="1222" y="926" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d" opacity="1">EFA / NVLink / PCIe = physical transport options</text>
  <text x="1222" y="949" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="500" fill="#506079" opacity="1">the same fabric can serve different software semantics</text>
  <text x="1502" y="1005" text-anchor="end" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="800" fill="#6748d6" opacity="1">NIXL, not NXIL</text>
</svg>