name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: npm ci
      - run: npm run check
      - name: Confirm generated diagrams are current
        run: git diff --exit-code -- docs/concepts/assets docs/reference-stacks/p5-two-node-efa/assets
